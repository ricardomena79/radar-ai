<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Live</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>ATLAS</h1>
    <div class="market-strip" id="context-bar"></div>
    <div class="status">
      <span id="scan-status">cargando...</span>
      <button id="rescan-btn">Actualizar ahora</button>
    </div>
  </header>

  <main id="cockpit">
    <aside id="ranking-rail">
      <div class="rail-title">Ranking</div>
      <div id="ranking-list">
        <div class="loading">Cargando...</div>
      </div>
    </aside>

    <section id="chart-column">
      <div id="chart-header">
        <div class="loading">Cargando...</div>
      </div>
      <div id="tv-container"></div>
    </section>

    <aside id="info-rail">
      <div id="info-body" class="loading">Seleccioná una acción del ranking.</div>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
